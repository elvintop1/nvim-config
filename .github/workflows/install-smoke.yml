name: Install smoke test
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'setup.sh'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/install-smoke.yml'
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install complete CLI toolchain without accounts or browser registration
        run: bash setup.sh --prefix "$HOME/cpw-smoke" --no-shell --no-nvim --skip-extensions
      - name: Check tools and real compiler/sample verdicts
        run: |
          source "$HOME/cpw-smoke/env.sh"
          cpw doctor
          CPW_TEST_PREFIX="$CPW_PREFIX" python -m unittest discover -s tests -v
